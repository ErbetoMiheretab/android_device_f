services:
  android_1:
    image: budtmo/docker-android:emulator_11.0
    container_name: android_1
    privileged: true
    environment:
      - DEVICE=Nexus 5
      - APPIUM=false
      - ENABLE_VNC=false
    ports:
      - "5555:5555"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

